name: Bug Report
description: Report a bug or unexpected behavior in Doculent
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below so we can reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what happened.
      placeholder: "When I try to upload a document, the page shows a blank screen instead of the processing view."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Go to the extraction dashboard
        2. Click "Upload document"
        3. Select a PDF file
        4. Click "Process"
        5. See blank screen
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser & OS
      description: Which browser and operating system are you using?
      placeholder: "Chrome 120 on macOS 14.2"

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: If applicable, add screenshots or screen recordings to help explain the issue.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other context about the problem — error messages, console output, recent changes to your setup, etc.
